# The registry's own check: a module that claims to give you Verilator
# is worth nothing if the toolchain does not resolve, so the test
# module builds something through it.
bcr_test_module:
  module_path: "integration"
  matrix:
    platform: ["ubuntu2204"]
    bazel: [8.x]
  tasks:
    verify_targets:
      name: "The toolchain resolves and Verilator runs"
      platform: ${{ platform }}
      bazel: ${{ bazel }}
      build_targets:
        - "@verilator_prebuilt//:verilator"
      test_targets:
        - "//..."
