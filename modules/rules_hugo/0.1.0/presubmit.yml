# The rules only need to load and analyze; building a real site is
# exercised by the consuming repositories' CI.
matrix:
  platform: [ubuntu2204]
  bazel: [9.x]
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - '@rules_hugo//hugo/...'
