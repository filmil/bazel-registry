# The archive is self-contained (TeX tree + tools + toolchain), so the
# presubmit only verifies that the module's targets analyze and build. Actually
# compiling a document is exercised by integration/ in the source repository's
# CI.
matrix:
  platform: [ubuntu2204]
  bazel: [9.x]
tasks:
  verify_targets:
    name: Verify build targets
    platform: ${{ platform }}
    bazel: ${{ bazel }}
    build_targets:
    - '@texlive_bundle//:all'
